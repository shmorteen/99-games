[project]
name = "ksa-games"
version = "0.1.0"
description = "KSA Games realtime multiplayer platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4,<6.0",
    "channels>=4.2,<5.0",
    "channels-redis>=4.2,<5.0",
    "daphne>=4.1,<5.0",
    "Django>=5.2,<6.0",
    "django-allauth>=65.0,<66.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyJWT>=2.10,<3.0",
    "redis>=5.0,<7.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "accounts",
    "accounts.migrations",
    "games",
    "games.migrations",
    "lobbies",
    "lobbies.migrations",
    "play",
    "play.migrations",
    "ksa_games",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ksa_games.test_settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
